# 최상위 섹션
  # service : 실행할 컨테이너 정의(db, app, web and ...)
  # volumns : 데이터 저장소 정의
  # networks : 컨테이너 간 통신을 위한 가상 네트워크 정의

service:
  db: 
    image: mysql:8.4
    volumes:
      - mysql)data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - backend-networks
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - ./app:/app
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - backend-networks
    
  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - backend-networks
